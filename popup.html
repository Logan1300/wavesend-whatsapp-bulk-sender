<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #13201a; }
  .head { display: flex; align-items: center; gap: 10px; background: #0b1d15; color: #fff; padding: 12px 14px; }
  .head img { width: 28px; height: 28px; border-radius: 7px; }
  .head small { display: block; color: #8fb3a1; font-size: 11px; }
  .body { padding: 14px; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
  .dot.running { background: #25d366; } .dot.paused { background: #e0a100; } .dot.scheduled { background: #2a6fdb; }
  .bar { height: 6px; background: #eef2f0; border-radius: 6px; overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; background: #128c4b; width: 0; }
  .note { color: #4a5a52; font-size: 12px; min-height: 16px; }
  .counts { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #4a5a52; }
  .counts b { color: #13201a; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  button { font: inherit; font-weight: 600; cursor: pointer; padding: 8px; border-radius: 8px; border: 1px solid #ced8d3; background: #fff; }
  button:hover { background: #f4f7f5; }
  button.primary { background: #128c4b; border-color: #128c4b; color: #fff; grid-column: span 2; }
  button.primary:hover { background: #0e7340; }
  button.danger { color: #c0392b; }
  #wa { grid-column: span 2; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="head"><img src="icons/icon48.png" alt=""><div><b>WaveSend</b><small>Bulk sender for WhatsApp Web</small></div></div>
  <div class="body">
    <div class="status"><span class="dot" id="dot"></span><span id="st">No active campaign</span></div>
    <div id="prog" hidden>
      <div class="bar"><i id="fill"></i></div>
      <div class="note" id="note"></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="btns">
      <button class="primary" id="dash">Open dashboard</button>
      <button id="pause" hidden>Pause</button>
      <button id="resume" hidden>Resume</button>
      <button class="danger" id="stop" hidden>Stop</button>
      <button id="wa">Open WhatsApp Web</button>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
